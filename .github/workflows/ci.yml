name: CI

# Machines Mac comptées dix fois tant que le dépôt est privé : seulement sur main
# et sur les PR prêtes à relire, jamais sur les brouillons.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Image en préversion avec Xcode 27 ; repli : macos-26 et Xcode_26.6.app (SDK iOS 26).
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: xcodebuild -version && swift --version

      - name: Tests de ChantierKit
        run: swift test --package-path Packages/ChantierKit

      - name: Compilation de l'app
        run: >
          xcodebuild -quiet -project Chantier.xcodeproj -scheme Chantier
          -destination 'generic/platform=iOS Simulator' build
